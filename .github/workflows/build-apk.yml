name: Build DFRoot APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: diabl0w/DFRoot
          ref: 209867fbb4059140cf474e4fa9b2ea57575a2ce1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'
      - name: Configure persistent signing
        env:
          KEYSTORE_B64: ${{ secrets.DFROOT_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.DFROOT_STORE_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dfroot-release.p12"
          printf 'KEYSTORE_FILE=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=dfroot\nKEY_PASSWORD=%s\n' "$RUNNER_TEMP/dfroot-release.p12" "$STORE_PASSWORD" "$STORE_PASSWORD" > signing.properties
      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verify and record provenance
        run: |
          mkdir -p delivery
          cp app/build/outputs/apk/release/DFRoot_4.1.apk delivery/
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs delivery/DFRoot_4.1.apk > delivery/APK-SIGNATURE.txt
          git rev-parse HEAD > delivery/SOURCE_COMMIT.txt
          cd delivery
          sha256sum DFRoot_4.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DFRoot-4.1-209867f-arm64
          path: delivery/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing files
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/dfroot-release.p12"
